<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Florist AIS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#ffd6e7,#ffeef5);
    min-height:100vh;
    padding:40px;
}

h1{
    text-align:center;
    color:#ff4f9a;
    margin-bottom:40px;
    font-size:42px;
}

.form{
    display:flex;
    gap:15px;
    margin-bottom:30px;
}

input{
    flex:1;
    padding:16px;
    border:none;
    border-radius:20px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(10px);
    font-size:16px;
    outline:none;
}

button{
    border:none;
    padding:16px 24px;
    border-radius:20px;
    background:#ff4f9a;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    background:#ff2f87;
}

.search{
    width:100%;
    margin-bottom:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:rgba(255,255,255,0.5);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:20px;
    box-shadow:0 10px 30px rgba(255,105,180,0.15);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:20px;
    margin-bottom:15px;
}

.card h2{
    color:#ff4f9a;
    margin-bottom:10px;
}

.price{
    font-size:20px;
    font-weight:600;
    margin-bottom:10px;
}

.quantity{
    color:#666;
}

</style>

</head>

<body>

<h1>🌸 Florist AIS</h1>

<div class="form">

<input type="text" id="name" placeholder="Название цветка">

<input type="number" id="price" placeholder="Цена">

<input type="number" id="quantity" placeholder="Количество">

<button onclick="addFlower()">
Добавить
</button>

</div>

<input
class="search"
type="text"
id="search"
placeholder="Поиск..."
onkeyup="searchFlowers()"
>

<div class="cards" id="flowers-list"></div>

<script>

const SUPABASE_URL = "https://jemdhlusgqkbdlyyrhxv.supabase.co";

const SUPABASE_KEY = "sb_publishable_pObwPIDKG_ig-mspBCmkfA_9utZgsDK";

const client = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function addFlower(){

    const name = document.getElementById("name").value;

    const price = document.getElementById("price").value;

    const quantity = document.getElementById("quantity").value;

    await client
    .from("flowers")
    .insert([
        {
            name:name,
            price:price,
            quantity:quantity
        }
    ]);

    loadFlowers();
}

async function loadFlowers(){

    const { data } = await client
    .from("flowers")
    .select("*");

    const list = document.getElementById("flowers-list");

    list.innerHTML = "";

    data.forEach(flower => {

        list.innerHTML += `
        
        <div class="card">

        <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=1200&auto=format&fit=crop">

        <h2>${flower.name}</h2>

        <div class="price">
        ${flower.price} ₸
        </div>

        <div class="quantity">
        Количество: ${flower.quantity}
        </div>

        </div>
        `;
    });
}

function searchFlowers(){

    let input = document.getElementById("search").value.toLowerCase();

    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {

        let text = card.innerText.toLowerCase();

        card.style.display = text.includes(input)
        ? "block"
        : "none";
    });
}

loadFlowers();

</script>

</body>
</html>
