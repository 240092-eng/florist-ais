<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Florist AIS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#ffd6e7,#fff0f5);
    min-height:100vh;
}

.container{
    width:85%;
    margin:auto;
    margin-top:40px;
    background:white;
    border-radius:30px;
    padding:30px;
    box-shadow:0 10px 30px rgba(255,105,180,0.2);
}

h1{
    text-align:center;
    color:#ff4f9a;
}

.inputs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:15px;
    background:#fff0f6;
}

button{
    background:#ff4f9a;
    color:white;
    border:none;
    border-radius:15px;
    padding:14px 20px;
    cursor:pointer;
}

button:hover{
    background:#ff2e85;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#ff4f9a;
    color:white;
    padding:15px;
}

td{
    text-align:center;
    padding:12px;
    border-bottom:1px solid #ffd6e7;
}

</style>

</head>

<body>

<div class="container">

<h1>🌸 Магазин Флористики</h1>

<div class="inputs">

<input type="text" id="name" placeholder="Название цветка">

<input type="number" id="price" placeholder="Цена">

<input type="number" id="quantity" placeholder="Количество">

<button onclick="addFlower()">
Добавить
</button>

</div>

<input type="text" id="search" placeholder="Поиск..." onkeyup="searchFlowers()">

<table>

<thead>
<tr>
<th>Название</th>
<th>Цена</th>
<th>Количество</th>
</tr>
</thead>

<tbody id="flowers-list"></tbody>

</table>

</div>

<script>

const SUPABASE_URL = "СЮДА_URL";
const SUPABASE_KEY = "СЮДА_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function addFlower(){

    const name = document.getElementById("name").value;

    const price = document.getElementById("price").value;

    const quantity = document.getElementById("quantity").value;

    await client
    .from("flowers")
    .insert([
        {
            name:name,
            price:price,
            quantity:quantity
        }
    ]);

    loadFlowers();
}

async function loadFlowers(){

    const { data } = await client
    .from("flowers")
    .select("*");

    const list = document.getElementById("flowers-list");

    list.innerHTML = "";

    data.forEach(flower => {

        list.innerHTML += `
        <tr>
            <td>${flower.name}</td>
            <td>${flower.price}</td>
            <td>${flower.quantity}</td>
        </tr>
        `;
    });
}

function searchFlowers(){

    let input = document.getElementById("search").value.toLowerCase();

    let rows = document.querySelectorAll("tbody tr");

    rows.forEach(row => {

        let text = row.innerText.toLowerCase();

        row.style.display = text.includes(input)
        ? ""
        : "none";
    });
}

loadFlowers();

</script>

</body>
</html>
